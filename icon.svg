<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#14243B"/>
      <stop offset="55%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="chassisRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#00E676" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="coinFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
  </defs>
  <!-- Opaque Maskable Safe-Area Background -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#chassisRim)" stroke-width="6"/>
  <!-- 3D Volumetric Floating Data Planes -->
  <path d="M 96 380 L 256 446 L 416 380 L 256 314 Z" fill="rgba(0, 230, 118, 0.09)" stroke="#00E676" stroke-width="4" stroke-dasharray="10 6"/>
  <path d="M 128 356 L 256 408 L 384 356 L 256 304 Z" fill="rgba(0, 242, 254, 0.16)" stroke="#00F2FE" stroke-width="5"/>
  <circle cx="96" cy="380" r="7" fill="#00E676"/>
  <circle cx="416" cy="380" r="7" fill="#00E676"/>
  <circle cx="256" cy="446" r="8" fill="#00F2FE"/>
  <!-- 3D Coin Cylinder Depth -->
  <path d="M 136 210 A 120 54 0 0 0 376 210 v 34 A 120 54 0 0 1 136 244 Z" fill="#0A0F1D" stroke="#00F2FE" stroke-width="3"/>
  <!-- 3D Coin Specular Face -->
  <ellipse cx="256" cy="210" rx="120" ry="54" fill="url(#coinFace)" stroke="#00F2FE" stroke-width="6"/>
  <ellipse cx="256" cy="210" rx="104" ry="44" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="3"/>
  <!-- Extruded 3D Cybernetic 'S' -->
  <path d="M 290 168 H 226 C 210 168 202 176 202 190 V 198 C 202 212 210 220 226 220 H 286 C 302 220 310 228 310 242 V 250 C 310 264 302 272 286 272 H 218" 
        fill="none" stroke="url(#sGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
